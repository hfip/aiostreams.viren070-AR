                <div class="font-extrabold text-rose-500">3. متى أحتاج لإعادة تثبيت الإضافة في Stremio بعد التعديل؟</div>
                <p class="text-zinc-600 dark:text-zinc-300">معظم التعديلات (الفلاتر، الترتيب، المنسق، إضافة مصادر فيديو) تطبق فوراً بمجرد الضغط على <strong>Save</strong> دون إعادة تثبيت! تحتاج لإعادة التثبيت فقط إذا عدّلت القوائم (Catalogs) أو إذا ظهرت نافذة تطلب منك ذلك.</p>
              </div>
              <div class="p-4 rounded-2xl bg-white dark:bg-[#111115] border border-zinc-200 dark:border-zinc-800 space-y-1.5">
                <div class="font-extrabold text-rose-500">4. خطأ صلاحيات مزامنة SEL أو Regex على النسخ الخاصة</div>
                <p class="text-zinc-600 dark:text-zinc-300">في النسخ المستضافة ذاتياً، للسماح لجميع المستخدمين باستيراد روابط SEL و Regex الخارجية بدون قيود، اضبط: <code>SEL_SYNC_ACCESS=all</code> و <code>REGEX_FILTER_ACCESS=all</code>.</p>
              </div>
            </div>
          </section>

          <section id="help-api" class="space-y-3 pt-4">
            <h2 class="text-xl font-extrabold border-b border-zinc-200 dark:border-zinc-800 pb-2">🔌 واجهة البرمجة (HTTP REST API &amp; Endpoints)</h2>
            <p class="text-xs sm:text-sm text-zinc-600 dark:text-zinc-300">يوفر AIOStreams واجهة برمجة متكاملة للبحث وإدارة المستخدمين وفحص الحالة (باستخدام Basic Auth عبر <code>UUID:password</code> مشفراً بـ Base64):</p>
            ${renderCode(`# 1. البحث المباشر عن روابط فيلم أو مسلسل عبر الـ Search API:
curl -u uuid:password "https://your-instance.example.com/api/v1/search?type=movie&id=tt15239678"

# 2. جلب بيانات المستخدم وإعداداته (منذ الإصدار v2.30+ عبر ترويسة Authorization):
curl "https://your-instance.example.com/api/v1/user" \\
  -H "Authorization: Basic $(echo -n 'UUID:PASSWORD' | base64)"

# 3. نقطة فحص حالة الخادم (Health / Status Endpoint في v2):
curl "https://your-instance.example.com/api/v1/status"

# 4. معلومات خادم Jellyfin المدمج وقدراته:
curl "https://your-instance.example.com/System/Info/Public"`, 'bash', 'AIOStreams REST API Examples')}
          </section>
        `
      }
    ];

    // ==========================================
    // STATE & INTERACTIVE CONTROLLERS
    // ==========================================
    let currentDocId = 'home';
    let selectedInstanceKey = 'yeb';
    let selectedChannel = 'nightly';

    const INSTANCE_MAP = {
      yeb: {
        name: "Yeb's (@nhyyeb)",
        stable: 'https://aiostreamsfortheweak.nhyira.dev/stremio/configure',
        nightly: 'https://aiostreams-nightly.fortheweak.cloud/stremio/configure'
      },
      elfhosted: {
        name: 'ElfHosted Public',
        stable: 'https://aiostreams.elfhosted.com/stremio/configure',
        nightly: 'https://aiostreams.elfhosted.com/stremio/configure'
      },
      midnight: {
        name: "Midnight's (@midnightignite)",
        stable: 'https://aiostreams.midnightignite.me/stremio/configure',
        nightly: 'https://aiostreams.midnightignite.me/stremio/configure'
      },
      viren: {
        name: "Viren's (@viren_7)",
        stable: 'https://aiostreams.viren070.me/stremio/configure',
        nightly: 'https://aiostreams.viren070.me/stremio/configure'
      },
      kuu: {
        name: "Kuu's (ATBP Hosting)",
        stable: 'https://aiostreams.atbphosting.com/stremio/configure',
        nightly: 'https://aiostreams.atbphosting.com/stremio/configure'
      },
      omni: {
        name: "Omni's (@a.ves)",
        stable: 'https://aiostreams.12312023.xyz/stremio/configure',
        nightly: 'https://aiostreams.12312023.xyz/stremio/configure'
      }
    };

    function showToast(msg) {
      const wrap = document.getElementById('toastContainer');
      if (!wrap) return;
      const el = document.createElement('div');
      el.className = 'px-4 py-2.5 rounded-xl bg-violet-600 text-white text-xs font-bold shadow-lg border border-violet-400/30 transition-all duration-300';
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 2200);
    }

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('✅ تم النسخ إلى الحافظة بنجاح!');
        }).catch(() => fallbackCopyText(text));
      } else {
        fallbackCopyText(text);
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('✅ تم النسخ إلى الحافظة بنجاح!');
      } catch (e) {
        showToast('⚠️ تعذر النسخ التلقائي');
      }
      document.body.removeChild(ta);
    }

    window.copyCodeBlock = function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      copyText(el.innerText || el.textContent);
    };

    // Interactive Formatter Preview Modes on Home Page
    window.setPreviewFormat = function(mode) {
      const codeEl = document.getElementById('formatterTemplateCode');
      const nameEl = document.getElementById('formatterPreviewName');
      const descEl = document.getElementById('formatterPreviewDesc');
      if (!codeEl || !nameEl || !descEl) return;

      ['prism', 'gdrive', 'torrentio'].forEach(k => {
        const btn = document.getElementById('fmt-btn-' + k);
        if (btn) {
          btn.className = (k === mode)
            ? 'fmt-mode-btn px-2.5 py-1 rounded bg-violet-600 text-white font-bold'
            : 'fmt-mode-btn px-2.5 py-1 rounded bg-zinc-800 text-zinc-300';
        }
      });

      if (mode === 'prism') {
        codeEl.textContent = '⚡ [RD+] 4K UHD • BluRay REMUX | DV • HDR10+ | TrueHD Atmos 7.1 | 68.4 GB | FraMeSToR';
        nameEl.textContent = '⚡ RD+ 4K';
        descEl.innerHTML = '<div class="font-bold text-white">🎬 BluRay REMUX • HEVC</div><div class="text-amber-300">✨ DV • HDR10+ | 🔊 TrueHD Atmos 7.1</div><div class="text-zinc-400">📦 68.4 GB • 🏷️ FraMeSToR • 🇬🇧 EN</div>';
      } else if (mode === 'gdrive') {
        codeEl.textContent = '[RD⚡] AIOStreams 4K DV HDR10+ -> Dune.Part.Two.2024.2160p.REMUX (68.4 GB)';
        nameEl.textContent = '[RD⚡] 2160p';
        descEl.innerHTML = '<div class="font-bold text-white">Dune: Part Two (2024) — BluRay REMUX</div><div class="text-emerald-300">DV | HDR10+ | TrueHD 7.1 Atmos | HEVC</div><div class="text-zinc-400">💾 68.4 GB | 👤 FraMeSToR | 🔌 Knaben</div>';
      } else {
        codeEl.textContent = '[RD+] Torrentio 4K DV/HDR10+ -> Dune.Part.Two.2024.2160p.UHD.BluRay.REMUX.mkv';
        nameEl.textContent = '[RD+] 4K';
        descEl.innerHTML = '<div class="font-bold text-white">Dune.Part.Two.2024.2160p.UHD.BluRay.REMUX</div><div class="text-zinc-300">👤 412 💾 68.4 GB ⚙️ FraMeSToR</div><div class="text-zinc-400">Multi Audio /🇬🇧 / DV / HDR10+ / Atmos</div>';
      }
    };

    // Interactive Instance Selector in Setup Guide
    window.selectPublicInstance = function(key) {
      selectedInstanceKey = key;
      document.querySelectorAll('.inst-card').forEach(btn => {
        const bKey = btn.getAttribute('data-inst');
        if (bKey === key) {
          btn.className = 'inst-card p-3 rounded-xl border-2 border-violet-500 bg-violet-500/10 text-right transition-all';
        } else {
          btn.className = 'inst-card p-3 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 text-right transition-all';
        }
      });
      const customWrap = document.getElementById('customInstanceInputWrap');
      if (customWrap) {
        if (key === 'custom') customWrap.classList.remove('hidden');
        else customWrap.classList.add('hidden');
      }
      updateTemplateLauncherLink();
    };

    window.setInstanceChannel = function(chan) {
      selectedChannel = chan;
      const stBtn = document.getElementById('chan-stable');
      const niBtn = document.getElementById('chan-nightly');
      if (stBtn && niBtn) {
        if (chan === 'stable') {
          stBtn.className = 'px-2.5 py-1 rounded-lg font-mono font-bold bg-violet-600 text-white';
          niBtn.className = 'px-2.5 py-1 rounded-lg font-mono font-bold text-zinc-500';
        } else {
          niBtn.className = 'px-2.5 py-1 rounded-lg font-mono font-bold bg-violet-600 text-white';
          stBtn.className = 'px-2.5 py-1 rounded-lg font-mono font-bold text-zinc-500';
        }
      }
      updateTemplateLauncherLink();
    };

    window.updateTemplateLauncherLink = function() {
      const labelEl = document.getElementById('selectedInstanceLabel');
      const urlTextEl = document.getElementById('selectedInstanceUrlText');
      const btnEl = document.getElementById('openTemplateActionBtn');
      if (!labelEl || !urlTextEl || !btnEl) return;

      let targetUrl = '';
      let displayTitle = '';

      if (selectedInstanceKey === 'custom') {
        const inp = document.getElementById('customInstanceUrlInput');
        const base = (inp ? inp.value.trim() : 'https://aiostreams.yourdomain.com').replace(/\/+$/, '');
        targetUrl = base + '/stremio/configure';
        displayTitle = 'فتح القالب على نسختك الخاصة (Self-Hosted)';
      } else {
        const info = INSTANCE_MAP[selectedInstanceKey] || INSTANCE_MAP.yeb;
        targetUrl = info[selectedChannel] || info.nightly;
        displayTitle = `فتح القالب على نسخة ${info.name} (${selectedChannel})`;
      }

      labelEl.textContent = displayTitle;
      urlTextEl.textContent = targetUrl;
      btnEl.href = targetUrl;
    };

    // ==========================================
    // SIDEBAR, TOC & NAVIGATION RENDERING
    // ==========================================
    function renderDocsLayout() {
      const pageIdx = DOC_PAGES.findIndex(p => p.id === currentDocId);
      const page = DOC_PAGES[pageIdx] || DOC_PAGES[0];

      // 1. Sidebar Tree
      const sbContainer = document.getElementById('sidebarTreeContainer');
      if (sbContainer) {
        const sections = [];
        DOC_PAGES.forEach(p => {
          if (!sections.includes(p.section)) sections.push(p.section);
        });

        sbContainer.innerHTML = sections.map(sec => {
          const items = DOC_PAGES.filter(p => p.section === sec);
          return `
            <div>
              <div class="text-[11px] font-extrabold text-zinc-400 dark:text-zinc-500 uppercase tracking-wider px-2.5 mb-1.5">${sec}</div>
              <div class="space-y-1">
                ${items.map(item => {
                  const isActive = item.id === currentDocId;
                  return `
                    <button type="button" onclick="navigateDoc('${item.id}')" class="w-full text-right px-3 py-2 rounded-lg text-xs font-bold transition-all flex items-center justify-between ${
                      isActive
                        ? 'bg-violet-600/15 text-violet-600 dark:text-violet-300 border-r-2 border-violet-500'
                        : 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-900 hover:text-zinc-900 dark:hover:text-zinc-200'
                    }">
                      <span class="truncate">${item.title}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }).join('');
      }

      // 2. Top Nav Active State
      document.querySelectorAll('.top-nav-link').forEach(btn => {
        const target = btn.getAttribute('data-top-nav');
        if (target === currentDocId) {
          btn.className = 'top-nav-link px-3 py-1.5 rounded-lg text-violet-600 dark:text-violet-400 bg-violet-500/10 font-extrabold transition-colors';
        } else {
          btn.className = 'top-nav-link px-3 py-1.5 rounded-lg hover:text-zinc-900 dark:hover:text-white transition-colors';
        }
      });

      // 3. Breadcrumbs & Original Link
      const bc = document.getElementById('docBreadcrumbs');
      if (bc) {
        bc.innerHTML = `
          <button type="button" onclick="navigateDoc('home')" class="hover:text-violet-500">AIOStreams</button>
          <span>/</span>
          <span>${page.section}</span>
          <span>/</span>
          <span class="text-violet-600 dark:text-violet-400 font-bold">${page.title}</span>
        `;
      }
      const origLink = document.getElementById('openOriginalPageLink');
      if (origLink) origLink.href = page.originalUrl;

      // 4. Article Body
      const article = document.getElementById('docArticleBody');
      if (article) {
        article.innerHTML = `
          <div class="space-y-2 pb-4 border-b border-zinc-200 dark:border-zinc-800/80">
            <div class="text-xs font-extrabold text-violet-500">${page.section}</div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-zinc-900 dark:text-white">${page.title}</h1>
            <p class="text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 leading-relaxed">${page.subtitle}</p>
          </div>
          ${page.render()}
        `;
      }

      // 5. Right-hand "On this page" TOC
      const tocEl = document.getElementById('onThisPageToc');
      if (tocEl) {
        tocEl.innerHTML = (page.toc || []).map(item => `
          <button type="button" onclick="scrollToSection('${item.id}')" class="block w-full text-right text-zinc-500 dark:text-zinc-400 hover:text-violet-500 dark:hover:text-violet-400 transition-colors py-0.5 leading-snug">
            ${item.label}
          </button>
        `).join('');
      }

      // 6. Prev / Next Cards
      const prev = pageIdx > 0 ? DOC_PAGES[pageIdx - 1] : null;
      const next = pageIdx < DOC_PAGES.length - 1 ? DOC_PAGES[pageIdx + 1] : null;
      const pagEl = document.getElementById('docPaginationCards');
      if (pagEl) {
        pagEl.innerHTML = `
          <div>
            ${prev ? `
              <button type="button" onclick="navigateDoc('${prev.id}')" class="w-full text-right p-4 rounded-xl bg-white dark:bg-[#111115] border border-zinc-200 dark:border-zinc-800 hover:border-violet-500 transition-all group">
                <div class="text-[11px] text-zinc-400 mb-1">→ السابق</div>
                <div class="text-xs sm:text-sm font-extrabold text-zinc-900 dark:text-white group-hover:text-violet-500">${prev.title}</div>
              </button>
            ` : ''}
          </div>
          <div>
            ${next ? `
              <button type="button" onclick="navigateDoc('${next.id}')" class="w-full text-left p-4 rounded-xl bg-white dark:bg-[#111115] border border-zinc-200 dark:border-zinc-800 hover:border-violet-500 transition-all group">
                <div class="text-[11px] text-zinc-400 mb-1">التالي ←</div>
                <div class="text-xs sm:text-sm font-extrabold text-zinc-900 dark:text-white group-hover:text-violet-500">${next.title}</div>
              </button>
            ` : ''}
          </div>
        `;
      }
    }

    window.navigateDoc = function(docId) {
      currentDocId = docId;
      closeMobileDrawer();
      renderDocsLayout();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.scrollToSection = function(secId) {
      const el = document.getElementById(secId);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };

    function openMobileDrawer() {
      const sb = document.getElementById('docsSidebar');
      const ov = document.getElementById('mobileOverlay');
      if (sb) sb.classList.remove('translate-x-full');
      if (ov) ov.classList.remove('hidden');
    }

    function closeMobileDrawer() {
      const sb = document.getElementById('docsSidebar');
      const ov = document.getElementById('mobileOverlay');
      if (sb) sb.classList.add('translate-x-full');
      if (ov) ov.classList.add('hidden');
    }

    // ==========================================
    // INITIALIZATION & EVENT LISTENERS
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const savedTheme = localStorage.getItem('aiostreams_docs_ar_theme');
        if (savedTheme === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
      } catch (e) {}

      renderDocsLayout();

      // Top navigation links
      document.querySelectorAll('.top-nav-link').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-top-nav');
          if (target) navigateDoc(target);
        });
      });

      // Brand button
      const brandBtn = document.getElementById('brandLogoBtn');
      if (brandBtn) brandBtn.addEventListener('click', () => navigateDoc('home'));

      // Copy Page Markdown button
      const copyMdBtn = document.getElementById('copyPageMdBtn');
      if (copyMdBtn) {
        copyMdBtn.addEventListener('click', () => {
          const article = document.getElementById('docArticleBody');
          if (article) copyText(article.innerText || article.textContent);
        });
      }

      // Mobile drawer
      const mobBtn = document.getElementById('mobileMenuBtn');
      const mobOv = document.getElementById('mobileOverlay');
      if (mobBtn) mobBtn.addEventListener('click', openMobileDrawer);
      if (mobOv) mobOv.addEventListener('click', closeMobileDrawer);

      // Theme toggle
      const themeBtn = document.getElementById('themeToggleBtn');
      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          try {
            localStorage.setItem('aiostreams_docs_ar_theme', isDark ? 'dark' : 'light');
          } catch (e) {}
        });
      }

      // Search Input
      const searchInput = document.getElementById('docSearchInput');
      const searchDropdown = document.getElementById('searchDropdown');
      const searchList = document.getElementById('searchMatchList');
      const searchCount = document.getElementById('searchCountLabel');
      const closeSearchBtn = document.getElementById('closeSearchDropdownBtn');

      if (searchInput && searchDropdown && searchList) {
        searchInput.addEventListener('input', () => {
          const q = searchInput.value.trim().toLowerCase();
          if (!q) {
            searchDropdown.classList.add('hidden');
            return;
          }
          const matches = DOC_PAGES.filter(p => {
            const hay = (p.title + ' ' + p.subtitle + ' ' + p.section + ' ' + p.render()).toLowerCase();
            return hay.includes(q);
          });
          searchDropdown.classList.remove('hidden');
          if (searchCount) searchCount.textContent = `نتائج البحث (${matches.length})`;
          if (!matches.length) {
            searchList.innerHTML = `<div class="text-xs text-zinc-400 p-2">لا توجد نتائج مطابقة لـ "${searchInput.value}"</div>`;
            return;
          }
          searchList.innerHTML = matches.map(m => `
            <button type="button" onclick="navigateDoc('${m.id}'); document.getElementById('searchDropdown').classList.add('hidden');" class="w-full text-right p-2.5 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800/80 transition-colors block">
              <div class="text-xs font-extrabold text-violet-500">${m.title}</div>
              <div class="text-[11px] text-zinc-500 dark:text-zinc-400 truncate">${m.subtitle}</div>
            </button>
          `).join('');
        });
      }
      if (closeSearchBtn && searchDropdown && searchInput) {
        closeSearchBtn.addEventListener('click', () => {
          searchDropdown.classList.add('hidden');
          searchInput.value = '';
        });
      }
    });
  </script>
</body>
